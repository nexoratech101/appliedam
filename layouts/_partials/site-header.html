<header class="aam-topnav">
  <div class="aam-topnav-inner">
    <a href="{{ .Site.BaseURL }}" class="aam-logo-link">
      <img src="/images/logo.png" alt="AppliedAM" class="aam-logo-img">
    </a>
    <input type="checkbox" id="aam-menu-toggle" class="aam-menu-toggle-input">
    <nav class="aam-nav-links" id="aam-nav-links">
      {{ range .Site.Menus.main }}
        {{ if and (ne .Name "Submit") (ne .Name "Submit a Project") }}
        <a href="{{ .URL }}" class="aam-nav-link">{{ .Name }}</a>
        {{ end }}
      {{ end }}
    </nav>
    <div class="aam-topnav-right">
      <button type="button" class="aam-search-toggle" id="aamSearchToggle" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="8" r="5.5" stroke="#fff" stroke-width="1.6"/><path d="M16 16l-3.5-3.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <label for="aam-menu-toggle" class="aam-hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <a href="/submission-form/" class="aam-nav-cta" target="_blank" rel="noopener">Submit</a>
    </div>
  </div>

  <div class="aam-search-panel" id="aamSearchPanel">
    <div class="aam-search-panel-inner">
      <div class="aam-search-input-row">
        <svg width="16" height="16" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" class="aam-search-input-icon"><circle cx="8" cy="8" r="5.5" stroke="#8A94A0" stroke-width="1.6"/><path d="M16 16l-3.5-3.5" stroke="#8A94A0" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="aamSearchInput" class="aam-search-input" placeholder="Search articles by title, topic, or tag..." autocomplete="off">
        <button type="button" class="aam-search-close" id="aamSearchClose" aria-label="Close search">&times;</button>
      </div>
      <div class="aam-search-results" id="aamSearchResults"></div>
    </div>
  </div>
</header>

<script>
(function () {
  var toggle = document.getElementById("aamSearchToggle");
  var panel = document.getElementById("aamSearchPanel");
  var closeBtn = document.getElementById("aamSearchClose");
  var input = document.getElementById("aamSearchInput");
  var resultsWrap = document.getElementById("aamSearchResults");
  if (!toggle || !panel || !input || !resultsWrap) return;

  var indexData = null;
  var indexPromise = null;

  function loadIndex() {
    if (indexPromise) return indexPromise;
    indexPromise = fetch("/search-index.json").then(function (r) { return r.json(); }).then(function (data) {
      indexData = data;
      return data;
    });
    return indexPromise;
  }

  function openPanel() {
    panel.classList.add("is-open");
    loadIndex();
    setTimeout(function () { input.focus(); }, 50);
  }

  function closePanel() {
    panel.classList.remove("is-open");
  }

  toggle.addEventListener("click", function () {
    if (panel.classList.contains("is-open")) { closePanel(); } else { openPanel(); }
  });
  closeBtn.addEventListener("click", closePanel);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePanel();
  });

  document.addEventListener("click", function (e) {
    if (!panel.contains(e.target) && !toggle.contains(e.target)) closePanel();
  });

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render(results, query) {
    if (!query) { resultsWrap.innerHTML = ""; resultsWrap.classList.remove("is-visible"); return; }
    resultsWrap.classList.add("is-visible");
    if (!results.length) {
      resultsWrap.innerHTML = '<div class="aam-search-empty">No articles found for &quot;' + escapeHtml(query) + '&quot;</div>';
      return;
    }
    resultsWrap.innerHTML = results.slice(0, 15).map(function (item) {
      return '<a href="' + item.permalink + '" class="aam-search-result">' +
        '<span class="aam-search-result-badge">' + escapeHtml(item.section) + '</span>' +
        '<span class="aam-search-result-title">' + escapeHtml(item.title) + '</span>' +
        '<span class="aam-search-result-desc">' + escapeHtml(item.description) + '</span>' +
        '</a>';
    }).join("");
  }

  function doSearch(query) {
    var q = query.trim().toLowerCase();
    if (!indexData) {
      loadIndex().then(function () { doSearch(query); });
      return;
    }
    if (q.length < 2) { render([], ""); return; }
    var results = indexData.filter(function (item) {
      var haystack = (item.title + " " + item.description + " " + (item.tags || []).join(" ")).toLowerCase();
      return haystack.indexOf(q) !== -1;
    });
    render(results, q);
  }

  var debounceTimer;
  input.addEventListener("input", function () {
    clearTimeout(debounceTimer);
    var val = input.value;
    debounceTimer = setTimeout(function () { doSearch(val); }, 150);
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { clearTimeout(debounceTimer); doSearch(input.value); }
  });
})();
</script>
